<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamiętnik AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('images/tlo-pamietnika.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .glow-text { text-shadow: 0 0 8px rgba(255, 105, 180, 0.8); }
        .overlay {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            padding: 20px;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: #ff69b4;
            text-shadow: 2px 2px 8px rgba(255, 20, 147, 0.6);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-pink-100 text-gray-900">
    <header class="bg-pink-500 text-white p-4 text-center shadow-md">
        <span class="logo">✨ PAMIĘTNIK AI ✨</span>
    </header>
    
    <nav class="flex justify-between p-4 bg-white shadow-md">
        <div class="space-x-4">
            <button class="tab-btn" data-tab="home">🏠 Strona Główna</button>
            <button class="tab-btn" data-tab="notes">📝 Notatki</button>
            <button class="tab-btn" data-tab="quotes">🌟 Afirmacje</button>
            <button class="tab-btn" data-tab="album">📷 Album</button>
        </div>
        <div>
            <button class="tab-btn" data-tab="auth">🔐 Logowanie</button>
            <button class="tab-btn" data-tab="register">🆕 Rejestracja</button>
        </div>
    </nav>
    
    <main class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-lg overlay">
        <div id="home" class="tab-content active-tab">
            <h2 class="text-3xl font-semibold mb-4 glow-text text-center">Witaj w Pamiętniku AI! 💖</h2>
            <p class="text-gray-700 text-lg text-center">Pamiętnik AI to Twój osobisty, wirtualny dziennik, który pozwala zapisywać myśli, przeżycia i emocje każdego dnia...</p>
        </div>

        <div id="auth" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Logowanie</h2>
            <input type="text" id="loginUsername" class="w-full p-2 border rounded-md mb-2" placeholder="Nazwa użytkownika">
            <input type="password" id="loginPassword" class="w-full p-2 border rounded-md mb-2" placeholder="Hasło">
            <button class="w-full bg-pink-500 text-white p-2 rounded-md">Zaloguj</button>
        </div>

        <div id="register" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Rejestracja</h2>
            <input type="text" id="registerUsername" class="w-full p-2 border rounded-md mb-2" placeholder="Nazwa użytkownika">
            <input type="password" id="registerPassword" class="w-full p-2 border rounded-md mb-2" placeholder="Hasło">
            <button class="w-full bg-pink-500 text-white p-2 rounded-md">Zarejestruj</button>
        </div>
    </main>
    
    <script>
        document.querySelectorAll(".tab-btn").forEach(button => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".tab-content").forEach(content => content.classList.remove("active-tab"));
                document.getElementById(button.getAttribute("data-tab")).classList.add("active-tab");
            });
        });
    </script>
</body>
</html>
