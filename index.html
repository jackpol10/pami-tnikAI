<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamiętnik AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <header class="bg-blue-600 text-white p-4 text-center text-2xl font-semibold shadow-md">
        Pamiętnik AI 📖✨
    </header>
    
    <main class="max-w-3xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-lg">
        <h2 class="text-xl font-semibold mb-4">Dodaj nowy wpis:</h2>
        <textarea class="w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" rows="4" placeholder="Napisz coś..."></textarea>
        <button class="mt-4 w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">Zapisz wpis</button>
    </main>
    
    <section class="max-w-3xl mx-auto mt-6">
        <h3 class="text-lg font-semibold mb-3">Twoje wpisy:</h3>
        <div class="space-y-4">
            <div class="p-4 bg-white rounded-lg shadow-md">
                <p class="text-gray-700">To jest przykładowy wpis. Możesz dodać swoje wspomnienia i zdjęcia! 😊</p>
            </div>
        </div>
    </section>
</body>
</html>
