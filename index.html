<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamiętnik AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffe4e1;
        }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .btn { background-color: #ff69b4; color: white; padding: 10px; border-radius: 5px; cursor: pointer; }
        .note { border: 1px solid #ff69b4; padding: 10px; margin-top: 5px; position: relative; }
        .delete-btn { color: red; font-size: 14px; position: absolute; top: 5px; right: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="bg-pink-500 text-white p-4 text-center">
        <h1 class="text-2xl">✨ PAMIĘTNIK AI ✨</h1>
    </header>

    <nav class="flex justify-between p-4 bg-white shadow-md">
        <div class="space-x-4">
            <button class="tab-btn" data-tab="notes">📝 Notatki</button>
            <button class="tab-btn" data-tab="quotes">🌟 Afirmacje</button>
            <button class="tab-btn" data-tab="album">📷 Album</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-lg">
        <!-- Notatki -->
        <div id="notes" class="tab-content active-tab">
            <h2 class="text-xl font-semibold mb-4">📝 Twoje Notatki</h2>
            <textarea id="noteInput" class="w-full p-2 border rounded-md" placeholder="Dodaj swoją notatkę..."></textarea>
            <button class="btn w-full mt-2" onclick="addNote()">Dodaj Notatkę</button>
            <ul id="notesList" class="mt-4"></ul>
        </div>

        <!-- Afirmacje -->
        <div id="quotes" class="tab-content">
            <h2 class="text-xl font-semibold mb-4">🌟 Codzienne Afirmacje</h2>
            <p id="affirmation" class="text-center text-lg font-semibold"></p>
            <button class="btn w-full mt-4" onclick="generateAffirmation()">Generuj Afirmację</button>
        </div>

        <!-- Album zdjęć -->
        <div id="album" class="tab-content">
            <h2 class="text-xl font-semibold mb-4">📷 Twój Album</h2>
            <input type="file" id="imageUpload" class="mb-4 p-2 border rounded-md">
            <button class="btn w-full" onclick="addImage()">Dodaj Zdjęcie</button>
            <div id="gallery" class="mt-4 grid grid-cols-2 gap-4"></div>
        </div>
    </main>

    <script>
        // Przełączanie między zakładkami
        document.querySelectorAll(".tab-btn").forEach(button => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".tab-content").forEach(content => content.classList.remove("active-tab"));
                document.getElementById(button.getAttribute("data-tab")).classList.add("active-tab");
            });
        });

        // Dodawanie notatek
        function addNote() {
            const noteInput = document.getElementById("noteInput");
            const notesList = document.getElementById("notesList");

            if (noteInput.value.trim() !== "") {
                const note = document.createElement("li");
                note.classList.add("note");
                note.innerHTML = `${noteInput.value} <span class="delete-btn" onclick="deleteNote(this)">❌</span>`;
                notesList.appendChild(note);
                noteInput.value = "";
            }
        }

        // Usuwanie notatek
        function deleteNote(element) {
            element.parentElement.remove();
        }

        // Generowanie afirmacji
        function generateAffirmation() {
            const affirmations = [
                "Jesteś silna i zdolna! 💪",
                "Każdy dzień to nowa szansa! 🌅",
                "Twoje myśli mają moc! ✨",
                "Masz w sobie ogromny potencjał! 🚀",
                "Zasługujesz na miłość i szczęście! 💖",
                "Jesteś wystarczająca taka, jaka jesteś! 💕",
                "Zmieniasz świat na lepsze! 🌍",
                "Każdy krok do przodu to sukces! 🏆",
                "Wszystko, czego potrzebujesz, masz w sobie! 🌟",
                "Twój uśmiech rozświetla świat! 😊"
            ];
            document.getElementById("affirmation").textContent = affirmations[Math.floor(Math.random() * affirmations.length)];
        }

        // Dodawanie zdjęć do albumu
        function addImage() {
            const imageUpload = document.getElementById("imageUpload");
            const gallery = document.getElementById("gallery");

            if (imageUpload.files.length > 0) {
                const file = imageUpload.files[0];
                const reader = new FileReader();

                reader.onload = function(event) {
                    const imageContainer = document.createElement("div");
                    imageContainer.classList.add("relative");

                    const img = document.createElement("img");
                    img.src = event.target.result;
                    img.classList.add("w-full", "rounded-md");

                    const deleteBtn = document.createElement("button");
                    deleteBtn.innerHTML = "❌";
                    deleteBtn.classList.add("absolute", "top-0", "right-0", "bg-red-500", "text-white", "p-1", "rounded-full");
                    deleteBtn.onclick = function() { gallery.removeChild(imageContainer); };

                    imageContainer.appendChild(img);
                    imageContainer.appendChild(deleteBtn);
                    gallery.appendChild(imageContainer);
                };

                reader.readAsDataURL(file);
                imageUpload.value = "";
            }
        }
    </script>
</body>
</html>
